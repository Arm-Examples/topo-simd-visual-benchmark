services:
  processor-scalar:
    platform: linux/arm64
    build:
      context: ./processor-runtime
      target: app-scalar
      args:
        BUILD_MARCH: "armv8-a+nosimd"
    ports:
      - "8090:8000"

  processor-neon:
    platform: linux/arm64
    build:
      context: ./processor-runtime
      target: app-neon
      args:
        BUILD_MARCH: "armv8-a"
    ports:
      - "8091:8000"

  processor-sve:
    platform: linux/arm64
    build:
      context: ./processor-runtime
      target: app-sve
      args:
        ENABLE_SVE: yes
        BUILD_MARCH: "armv8.2-a+sve"
    ports:
      - "8092:8000"

  dashboard:
    platform: linux/arm64
    build:
      context: ./dashboard-ui
      args:
        PROCESSOR_CLIENT_TIMEOUT_S: 30
        ENABLE_SVE: yes
    depends_on:
      - processor-scalar
      - processor-neon
      - processor-sve
    ports:
      - "8095:8080"

x-topo:
  name: "simd-visual-benchmark"
  description: |
    Visual demonstration of SIMD performance benefits on Arm processors.
    Compare scalar (no SIMD), NEON (128-bit), and SVE (scalable vector)
    implementations running identical image processing workloads side-by-side.

    This demo shows real hardware acceleration through three C++ services
    compiled with different architecture flags, processing the same box blur
    algorithm on images. Performance differences are measured in real-time
    and displayed in an interactive web dashboard.

    Perfect for demonstrating to non-technical audiences the concrete benefits
    of SIMD optimizations, with visual results and quantified speedups.

  features:
    - "NEON"
    - "SVE"

  args:
    ENABLE_SVE:
      description: |
        Set to "no" to disable the SVE column in the dashboard. The processor-sve
        container will not start.
      default: "yes"

    PROCESSOR_CLIENT_TIMEOUT_S:
      description: |
        HTTP timeout in seconds that the dashboard uses when contacting the
        processor services. Increase when running very large workloads.
      default: "30"
